# This workflow installs Python dependencies and verifies the runtime bootstrap.
# For more information see:
#   https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI

on:
  push:
    branches: [main, Steve_test]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r cloneit-web-cloning/assets/requirements.txt

      - name: Run runtime bootstrap validation
        env:
          GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
        run: |
          python cloneit-web-cloning/scripts/clone_with_gemini.py --bootstrap-only

      - name: Check that .env is not tracked by git
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error:: .env is tracked by git. Remove it from history."
            exit 1
          fi
